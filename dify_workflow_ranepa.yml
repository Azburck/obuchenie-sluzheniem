    - sourcePosition: right
      targetPosition: left
      zIndex: 0
      id: parse_dobro_tasks
      positionAbsolute:
        x: 1370
        y: 250
      data:
        code: "import json\nimport re\n\nDOBRO_DIRECTIONS = [\n    '#МЫВМЕСТЕ', '#создавай_возможности',\
          \ '#развивай_среду', '#будь_здоров',\n    '#сохраняй_природу', '#стирай_границы',\
          \ '#защищай', '#объединяй',\n    '#помни', '#открывай_страну', '#делись_опытом',\
          \ '#вклад_в_будущее',\n    '#расскажи_о_главном'\n]\n\ndef format_card(task,\
          \ idx):\n    dirs = \", \".join(task.get(\"directions\", []))\n    ready\
          \ = \"Да\" if task.get(\"ready_for_on_site\") else \"Нет\"\n    return f\"\
          \"\"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\U0001F4CC {task.get(\"\
          variantLabel\", f\"Вариант {idx}\")}: {task.get(\"task_title\", \"\")}\n\
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\U0001F3F7️ Направления\
          \ Добро.рф: {dirs}\n\U0001F4CD Регион: {task.get(\"region\", \"Москва\"\
          )}  |  Формат: {task.get(\"participation_format\", \"Гибридный\")}  |  Очное\
          \ присутствие: {ready}\n\n\U0001F4CB Описание социальной задачи:\n{task.get(\"\
          task_description\", \"\")}\n\n\U0001F3AF Целевая аудитория (благополучатели):\n\
          {task.get(\"target_audience\", \"\")}\n\n\U0001F4E6 Ожидаемый прикладной\
          \ продукт:\n{task.get(\"expected_product\", \"\")}\n\nℹ️ Дополнительная\
          \ информация и компетенции:\n{task.get(\"additional_info\", \"\")}\"\"\"\
          \n\ndef main(raw_response: str = \"\", org_name: str = \"\") -> dict:\n\
          \    if not raw_response:\n        return {\"result_text\": \"Ошибка: пустой\
          \ ответ от модели\", \"tasks\": []}\n        \n    content = \"\"\n    try:\n\
          \        data = json.loads(raw_response) if isinstance(raw_response, str)\
          \ else raw_response\n        content = data.get(\"choices\", [{}])[0].get(\"\
          message\", {}).get(\"content\", \"\")\n    except Exception:\n        content\
          \ = str(raw_response)\n        \n    clean = content.strip().replace('\\\
          u00a0', ' ').replace('\\xa0', ' ')\n    if clean.startswith(\"```\"):\n\
          \        clean = clean.split(\"\\n\", 1)[1] if \"\\n\" in clean else clean[3:]\n\
          \    if clean.endswith(\"```\"):\n        clean = clean.rsplit(\"\\n\",\
          \ 1)[0] if \"\\n\" in clean else clean[:-3]\n    clean = clean.strip()\n\
          \    \n    match = re.search(r'\\[\\s*\\{.*\\}\\s*\\]', clean, re.DOTALL)\n\
          \    if match:\n        clean = match.group(0)\n        \n    try:\n   \
          \     parsed = json.loads(clean)\n    except Exception as e:\n        return\
          \ {\"result_text\": f\"Ошибка разбора ответа ИИ: {str(e)}\", \"tasks\":\
          \ []}\n        \n    normalized = []\n    for idx, item in enumerate(parsed):\n\
          \        if not isinstance(item, dict):\n            continue\n        \
          \    \n        raw_dirs = item.get(\"directions\", [])\n        clean_dirs\
          \ = []\n        for d in raw_dirs:\n            tag = str(d).strip()\n \
          \           if not tag.startswith('#'):\n                tag = f\"#{tag}\"\
          \n            if tag in DOBRO_DIRECTIONS and tag not in clean_dirs:\n  \
          \              clean_dirs.append(tag)\n        if not clean_dirs:\n    \
          \        clean_dirs = [\"#МЫВМЕСТЕ\"]\n            \n        task = {\n\
          \            \"id\": f\"gigachat-task-{idx+1}\",\n            \"variantLabel\"\
          : item.get(\"variantLabel\") or f\"Вариант {idx+1}\",\n            \"task_title\"\
          : str(item.get(\"task_title\", \"\"))[:120],\n            \"directions\"\
          : clean_dirs[:3],\n            \"task_description\": str(item.get(\"task_description\"\
          , \"\")),\n            \"target_audience\": str(item.get(\"target_audience\"\
          , \"\")),\n            \"expected_product\": str(item.get(\"expected_product\"\
          , \"\")),\n            \"region\": item.get(\"region\") or \"Москва\",\n\
          \            \"participation_format\": item.get(\"participation_format\"\
          ) or \"Гибридный\",\n            \"edu_institution_type\": \"Высшее учебное\
          \ заведение\",\n            \"ready_for_on_site\": bool(item.get(\"ready_for_on_site\"\
          , True)),\n            \"additional_info\": str(item.get(\"additional_info\"\
          , \"\"))\n        }\n        normalized.append(task)\n        \n    partner_title\
          \ = org_name.strip() if org_name else \"Социальный партнер\"\n    header\
          \ = (\n        \"\U0001F393 ПРЕЗИДЕНТСКАЯ АКАДЕМИЯ (РАНХиГС) — «ОБУЧЕНИЕ\
          \ СЛУЖЕНИЕМ»\\n\"\n        f\"Организация: {partner_title}\\n\"\n      \
          \  \"Сформировано 3 варианта проектных задач под формат платформы Добро.рф:\\\
          n\"\n    )\n    cards_text = \"\\n\\n\".join(format_card(t, i) for i, t\
          \ in enumerate(normalized, 1))\n    result_text = f\"{header}\\n{cards_text}\"\
          \n        \n    return {\n        \"result_text\": result_text,\n      \
          \  \"tasks\": normalized\n    }\n"
        code_language: python3
        title: Парсер задач Добро.рф
        outputs:
          result_text:
            type: string
          tasks:
            type: array[object]
        type: code
        variables:
        - variable: raw_response
          value_selector:
          - gigachat_chat
          - body
        - variable: org_name
          value_selector:
          - start_node
          - org_name
        selected: false
      position:
        y: 250
        x: 1370
      type: custom
      height: 52
      selected: false
      width: 242
    - sourcePosition: right
      targetPosition: left
      zIndex: 0
      id: prepare_context
      positionAbsolute:
        x: 710
        y: 250
      data:
        code: "import json\n\ndef main(org_name: str = \"\", contact_fio: str = \"\
          \", materials_text: str = \"\", website_raw: str = \"\", oauth_body: str\
          \ = \"\") -> dict:\n    access_token = \"\"\n    try:\n        oauth_data\
          \ = json.loads(oauth_body) if isinstance(oauth_body, str) else oauth_body\n\
          \        access_token = oauth_data.get(\"access_token\", \"\")\n    except\
          \ Exception:\n        pass\n    \n    auth_header = f\"Bearer {access_token}\"\
          \n    \n    web_clean = \"\"\n    if website_raw and len(website_raw.strip())\
          \ > 50:\n        if \"Welcome to Jina\" not in website_raw and \"Warning\"\
          \ not in website_raw[:100]:\n            web_clean = website_raw.strip()[:8000]\n\
          \            \n    system_prompt = (\n        \"Ты — ведущий методолог федеральной\
          \ программы «Обучение служением» в Президентской академии (РАНХиГС).\\n\"\
          \n        \"Твоя задача: упаковать материалы социального партнера в ровно\
          \ 3 разноплановых варианта студенческих проектов строго под анкету платформы\
          \ Добро.рф:\\n\"\n        \"1. Вариант 1 (Аналитика/исследование) — полевые/кабинетные\
          \ исследования, аудит потребностей, аналитический отчет.\\n\"\n        \"\
          2. Вариант 2 (Прикладной цифровой продукт) — база данных, чат-бот, портал,\
          \ регламент, интерактивная карта.\\n\"\n        \"3. Вариант 3 (Медиа/просвещение/событие)\
          \ — просветительская акция, организация мероприятия, медиасопровождение.\\\
          n\\n\"\n        \"ПРАВИЛА ВЫБОРА НАПРАВЛЕНИЙ (ТЕГОВ) ДОБРО.РФ:\\n\"\n  \
          \      \"В поле 'directions' укажи от 1 до 3 тегов СТРОГО с символом # из\
          \ официального списка с учетом специфики:\\n\"\n        \"- #сохраняй_природу:\
          \ защита природы, животные, зооволонтерство, сельское хозяйство, фермы,\
          \ экология.\\n\"\n        \"- #развивай_среду: благоустройство, городская\
          \ и сельская среда, территориальное развитие.\\n\"\n        \"- #создавай_возможности:\
          \ образование, наука, цифровые сервисы, развитие талантов и компетенций.\\\
          n\"\n        \"- #будь_здоров: здравоохранение, донорство, ЗОЖ, помощь больным\
          \ и паллиативная забота.\\n\"\n        \"- #стирай_границы: инклюзия, поддержка\
          \ людей с ОВЗ и инвалидностью.\\n\"\n        \"- #защищай: правовая защита,\
          \ безопасность, юриспруденция.\\n\"\n        \"- #МЫВМЕСТЕ: помощь семьям\
          \ в трудной ситуации, ветеранам, общественная поддержка.\\n\"\n        \"\
          - #объединяй: межкультурный диалог, объединение сообществ, межрегиональные\
          \ связи.\\n\"\n        \"- #делись_опытом: наставничество, передача практических\
          \ навыков.\\n\"\n        \"- #вклад_в_будущее: профориентация, молодежные\
          \ инициативы, поддержка детей.\\n\"\n        \"- #расскажи_о_главном: медиаволонтерство,\
          \ инфографика, просветительские кампании в СМИ и соцсетях.\\n\"\n      \
          \  \"- #помни: патриотическое воспитание, историческая память, сохранение\
          \ наследия.\\n\"\n        \"- #открывай_страну: краеведение, внутренний\
          \ туризм, экспедиции.\\n\\n\"\n        \"ТРЕБОВАНИЯ К ПОЛЯМ ОБЪЕКТА:\\n\"\
          \n        \"- task_title: емкий заголовок строго до 120 символов.\\n\"\n\
          \        \"- directions: массив от 1 до 3 подходящих хештегов из списка\
          \ выше.\\n\"\n        \"- task_description, target_audience, expected_product,\
          \ additional_info: подробные академические тексты (до 3000 символов).\\\
          n\"\n        \"- participation_format: строго одно из: 'Очный', 'Заочный\
          \ / Онлайн', 'Гибридный'.\\n\"\n        \"- edu_institution_type: 'Высшее\
          \ учебное заведение'.\\n\"\n        \"- ready_for_on_site: true или false.\\\
          n\\n\"\n        \"ВЕРНИ ОТВЕТ СТРОГО В ВИДЕ JSON-МАССИВА ИЗ 3 ОБЪЕКТОВ.\
          \ ТОЛЬКО ЧИСТЫЙ JSON БЕЗ ВВОДНЫХ СЛОВ.\"\n    )\n    \n    user_prompt =\
          \ f\"Организация: {org_name or 'Социальный партнер'}\\nКонтактное лицо:\
          \ {contact_fio or 'Куратор'}\\n\\n\"\n    if materials_text and materials_text.strip():\n\
          \        user_prompt += f\"Материалы, документы и голосовые заметки партнера:\\\
          n{materials_text.strip()}\\n\\n\"\n    if web_clean:\n        user_prompt\
          \ += f\"Содержимое сайта организации:\\n{web_clean}\\n\\n\"\n    user_prompt\
          \ += \"Сформируй 3 проектных задачи под формат Добро.рф с точными тегами\
          \ направлений.\"\n    \n    safe_user_prompt = user_prompt.replace('\\\\\
          ', '\\\\\\\\').replace('\"', '\\\\\"').replace('\\n', '\\\\n').replace('\\\
          r', '')\n    safe_system_prompt = system_prompt.replace('\\\\', '\\\\\\\\\
          ').replace('\"', '\\\\\"').replace('\\n', '\\\\n').replace('\\r', '')\n\
          \    \n    return {\n        \"auth_header\": auth_header,\n        \"system_prompt\"\
          : safe_system_prompt,\n        \"prompt_text\": safe_user_prompt\n    }\n"
        code_language: python3
        title: Подготовка промпта
        outputs:
          auth_header:
            type: string
          prompt_text:
            type: string
          system_prompt:
            type: string
        type: code
        variables:
        - variable: org_name
          value_selector:
          - start_node
          - org_name
        - variable: contact_fio
          value_selector:
          - start_node
          - contact_fio
        - variable: materials_text
          value_selector:
          - start_node
          - materials_text
        - variable: website_raw
          value_selector:
          - jina_scraper
          - body
        - variable: oauth_body
          value_selector:
          - gigachat_oauth
          - body
        selected: false
      position:
        y: 250
        x: 710
      type: custom
      height: 52
      selected: false
      width: 242
